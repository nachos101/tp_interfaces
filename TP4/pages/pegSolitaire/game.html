<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego</title>
    <link rel="stylesheet" href="../../css/pegSolitaire.css">
</head>
<body class="game">
    <!-- Selección de personaje y dificultad -->
    <section id="configScreen">
        <h2>Configura tu partida</h2>
        <h3>Elige tu personaje</h3>

        <div class="character-select">
            <label><input type="radio" name="character" value="kitty" checked > 
                <img src="../../images/peg/hellokittyToken.png" alt="hello kitty">
                Hello kitty
            </label>
            <label><input type="radio" name="character" value="keroppi"> 
                <img src="../../images/peg/keroppiToken.png" alt="keroppi">
                Keroppi
            </label>
            <label><input type="radio" name="character" value="hangyodon"> 
                <img src="../../images/peg/hangyodonToken.png" alt="hangyodon">
                Hangyodon
            </label>
        </div>

        <!-- Selección de Dificultad -->
        <h3>Elige la dificultad:</h3>

        <div class="difficulty-select">
            <label><input type="radio" name="difficulty" value="0" checked> Principiante (Sin límite)</label>
            <label><input type="radio" name="difficulty" value="600"> Casual (10 minutos)</label>
            <label><input type="radio" name="difficulty" value="180"> Speedrun (3 minutos)</label>
        </div>

        <button id="btnJugar">¡Jugar!</button>
    </section>


    <!-- Pantalla de juego -->
    <section id="gameScreen" hidden>

        <button class="game-hud__btn" id="backBtn">
            <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 512 512">
                <path d="M0 0h512v512H0z" fill="none" />
                <path fill="#fff" d="M48 256c0 114.87 93.13 208 208 208s208-93.13 208-208S370.87 48 256 48S48 141.13 48 256m212.65-91.36a16 16 0 0 1 .09 22.63L208.42 240H342a16 16 0 0 1 0 32H208.42l52.32 52.73A16 16 0 1 1 238 347.27l-79.39-80a16 16 0 0 1 0-22.54l79.39-80a16 16 0 0 1 22.65-.09" />
            </svg>
            Volver
        </button>

        <div class="game-hud">
            <span class="game-hud__timer" id="timerDisplay"></span>
            <button class="game-hud__hints" id="hintsBtn">
                <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 16 16">
                    <path d="M0 0h16v16H0z" fill="none" />
                    <path fill="#fff" d="M8 1a7 7 0 1 1 0 14A7 7 0 0 1 8 1m0 10a1 1 0 1 0 0 2a1 1 0 0 0 0-2m.585-7.942a3 3 0 0 0-3.08 1.275a1 1 0 0 0 1.663 1.111a1.001 1.001 0 0 1 1.756.939a1 1 0 0 1-.445.495c-.31.17-.66.412-.94.741C7.251 7.953 7 8.42 7 9l.005.103a1 1 0 0 0 1.99 0L9 9.01c-.001.004 0-.025.058-.091a1.4 1.4 0 0 1 .381-.287a3 3 0 0 0 1.333-1.485a3 3 0 0 0-2.186-4.09" />
                </svg>
                Ayuda
            </button>
            <button class="game-hud__btn" id="resetBtn">
                <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24">
                    <path d="M0 0h24v24H0z" fill="none" />
                    <path fill="#fff" fill-rule="evenodd" d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22ZM15.9346 5.59158C16.217 5.70662 16.4017 5.98121 16.4017 6.28616V9.00067C16.4017 9.41489 16.0659 9.75067 15.6517 9.75067H13C12.6983 9.75067 12.4259 9.56984 12.3088 9.29174C12.1917 9.01364 12.2527 8.69245 12.4635 8.47659L13.225 7.69705C11.7795 7.25143 10.1467 7.61303 9.00097 8.78596C7.33301 10.4935 7.33301 13.269 9.00097 14.9765C10.6593 16.6742 13.3407 16.6742 14.999 14.9765C15.6769 14.2826 16.0805 13.4112 16.2069 12.5045C16.2651 12.0865 16.5972 11.7349 17.0192 11.7349C17.4246 11.7349 17.7609 12.0595 17.7217 12.463C17.5957 13.7606 17.0471 15.0265 16.072 16.0247C13.8252 18.3248 10.1748 18.3248 7.92796 16.0247C5.69068 13.7344 5.69068 10.0281 7.92796 7.7378C9.66551 5.95905 12.244 5.55465 14.3647 6.53037L15.1152 5.76208C15.3283 5.54393 15.6522 5.47653 15.9346 5.59158Z" clip-rule="evenodd" />
                </svg>
                Reiniciar
            </button>
        </div>

        <canvas id="pegCanva" width="1280" height="640"> </canvas>

    </section>

    <script type="module" src="../../js/pegSolitaire/Main.js"></script>
</body>
</html>
