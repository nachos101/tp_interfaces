<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego</title>
    <link rel="stylesheet" href="../../css/pegSolitaire.css">
</head>
<body class="game">
    <!-- Selección de personaje y dificultad -->
    <section id="configScreen">
        <div class="character-select">
            <h2>Elige tu personaje</h1>
            <label><input type="radio" name="character" value="kitty" checked> Hello Kitty
                <img src="../../images/peg/hellokittyToken.png" alt="hello kitty">
            </label>
            <label><input type="radio" name="character" value="keroppi"> 
                Keroppi
                <img src="../../images/peg/keroppiToken.png" alt="keroppi">
            </label>
            <label><input type="radio" name="character" value="hangyodon"> 
                Hangyodon
                <img src="../../images/peg/hangyodonToken.png" alt="hello kitty">
            </label>
        </div>

        <!-- Selección de Dificultad -->
        <div class="difficulty-select">
            <h2>Elige la dificultad:</h2>
            <label><input type="radio" name="difficulty" value="0" checked> Principiante (Sin límite)</label>
            <label><input type="radio" name="difficulty" value="600"> Casual (10 minutos)</label>
            <label><input type="radio" name="difficulty" value="180"> Speedrun (3 minutos)</label>
        </div>

        <button id="btnJugar">¡Jugar!</button>

        <!-- Acá van los personajes -->
        <!-- Acá van las dificultades -->

        <button id="startGameBtn">Comenzar</button>
    </section>


    <!-- Pantalla de juego -->
    <section id="gameScreen" hidden>
        <div class="game-hud">
            <span class="game-hud__timer" id="timerDisplay">5:00</span>
            <button class="game-hud__btn" id="resetBtn">Reiniciar</button>
            <button class="game-hud_hints" id="hintsBtn">
                <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 16 16">
                    <path d="M0 0h16v16H0z" fill="none" />
                    <path fill="#ff69b4" d="M8 1a7 7 0 1 1 0 14A7 7 0 0 1 8 1m0 10a1 1 0 1 0 0 2a1 1 0 0 0 0-2m.585-7.942a3 3 0 0 0-3.08 1.275a1 1 0 0 0 1.663 1.111a1.001 1.001 0 0 1 1.756.939a1 1 0 0 1-.445.495c-.31.17-.66.412-.94.741C7.251 7.953 7 8.42 7 9l.005.103a1 1 0 0 0 1.99 0L9 9.01c-.001.004 0-.025.058-.091a1.4 1.4 0 0 1 .381-.287a3 3 0 0 0 1.333-1.485a3 3 0 0 0-2.186-4.09" />
                </svg>
                Ayuda
            </button>
        </div>

        <canvas id="pegCanva" width="1280" height="640"> </canvas>

    </section>

    <script type="module" src="../../js/pegSolitaire/Main.js"></script>
</body>
</html>
