<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
</head>
<body>
    <section class="formContainer">
        <div class="logoContainer">
            <img src="images/logo.png" alt="Palabras One Game con un sobrero de paja por encima.">
        </div>
        <h1>Registrate</h1>

        <form class="form">
            <div class="field">
                <label for="name">Nombre</label>
                <input type="text" id="name" placeholder="juancito" required >
            </div>
            <div class="field">
                <label for="username">Nombre de usuario</label>
                <input type="text" id="username" placeholder="luffy147">
            </div>

        </form>

    </section>    
</body>
</html>
