<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/login.css">
    <title>OneGame</title>
</head>
<body class="body">

    <section class="formContainer">
        <div class="logoContainer">
            <img src="images/logo.png" alt="Palabras One Game con un sobrero de paja por encima.">
        </div>
        <h1>Inicia Sesión</h1>
        <form class="form">
            <div class="field">
                <label for="username">Nombre de usuario</label>
                <input type="text" id="username" placeholder="luffy147">
            </div>
            <div class="field">
                <label for="password">Contraseña</label>
                <div class="input-wrapper">
                    <input type="password" id="password" placeholder="******">
                    <button type="button" class="eye-btn">
                        <img class="eye-btn image" src="images/closedEye.png" alt="ojo cerrado">
                    </button>
                </div>
                <a href="#" class="linkCaption"><span class="link">Olvidé mi contraseña</span></a>
            </div>
            <button class="button login">Iniciar Sesión</button>
        </form>

        <hr>
        <div class="socialLogin">
            <button class="button app google">

                    <rect width="20" height="20" fill="white"/>

                Continue with Google
            </button>

            <button class="button app facebook"> 
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <path d="M14.3447 11.1068L14.863 7.69417H11.621V5.48058C11.621 4.54672 12.0731 3.63592 13.5251 3.63592H15V0.730583C15 0.730583 13.6621 0.5 12.3836 0.5C9.71233 0.5 7.96804 2.13483 7.96804 5.0932V7.69417H5V11.1068H7.96804V19.357C8.56393 19.4516 9.17352 19.5 9.79452 19.5C10.4155 19.5 11.0251 19.4516 11.621 19.357V11.1068H14.3447Z" fill="white"/>

                Continue with Facebook
            </button>
       
        </div>
        
        <div> 
            <a href="pages/register.html" class="linkCaption">No tienes una cuenta en One Game? <span class="link">Registrate aquí</span> </a>
        </div>
        
    </section>

    <script src="js/script.js"></script>

</html>
